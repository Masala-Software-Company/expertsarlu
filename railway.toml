# Option A (recommandée) : dans Railway UI → Settings → Root Directory = backend
# Option B : laisser Root Directory vide — ce Dockerfile ne copie que backend/

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "Dockerfile", "railway.toml", "railway.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
