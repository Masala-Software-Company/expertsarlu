[package]
name = "expert"
version = "1.0.0"
description = "eXpert SARLU — Bureau de Coordination Médicale Internationale"
authors = ["eXpert SARLU"]
edition = "2021"

[lib]
name = "expert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
