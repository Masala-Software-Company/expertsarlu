services:
  postgres:
    image: postgres:16-alpine
    container_name: expert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expert
      POSTGRES_PASSWORD: expert
      POSTGRES_DB: expert
    ports:
      - "5432:5432"
    volumes:
      - expert_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert -d expert"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: expert-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - expert_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: expert-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expert-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  expert_pg_data:
  expert_redis_data:
